<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Kheti Sahayak</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}.login-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 24px 80px #0006}.login-card h1{margin:22px 0 6px}.login-card .muted{margin:0 0 22px}.login-card label{display:block;font-size:.82rem;margin:14px 0 6px;color:var(--muted)}.login-card input,.login-card select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:12px}.demo{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px}.demo button{margin:7px 6px 0 0}.login-error{margin:12px 0;padding:10px;border-radius:8px;background:#6d271e;color:#fff}.login-actions{display:flex;gap:10px;margin-top:18px}.login-actions button{flex:1}.brand.large{display:flex;align-items:center;gap:12px}.brand.large b{display:block;font-size:1.3rem}.brand.large span{display:block;color:var(--muted);font-size:.75rem}</style></head><body><div class="login-wrap"><div class="login-card"><div class="brand large"><div class="brand-mark"></div><div><b>Kheti Sahayak</b><span>FarmGrid resource intelligence</span></div></div><h1 id="heading">Welcome back</h1><p class="muted">Sign in to open your farmer or provider dashboard.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><div id="error"></div><div class="login-actions"><button class="btn btn-primary" type="submit">Sign in</button><a class="btn btn-ghost" href="index.html">Back</a></div></form><div class="demo"><strong>Demo accounts</strong><div><button class="btn btn-ghost small" data-email="farmer@farmgrid.demo">Farmer</button><button class="btn btn-ghost small" data-email="owner@farmgrid.demo">Provider</button><button class="btn btn-ghost small" data-email="admin@farmgrid.demo">Admin</button></div><small style="color:var(--muted)">Password: farmgrid123</small></div></div></div><script src="api.js"></script><script>(async()=>{const q=new URLSearchParams(location.search);const role=q.get('role');const email=document.getElementById('email');const pass=document.getElementById('password');email.value=role==='resource_owner'?'owner@farmgrid.demo':'farmer@farmgrid.demo';pass.value='farmgrid123';document.querySelectorAll('[data-email]').forEach(b=>b.onclick=()=>{email.value=b.dataset.email;pass.value='farmgrid123'});document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('error');err.innerHTML='';try{const r=await FG_API('/auth/login',{method:'POST',body:{email:email.value.trim(),password:pass.value}});const u=await FG_API('/auth/me',{token:r.access_token});if(role==='farmer' && u.role!=='farmer') throw new Error('This login is for a Farmer account. Please use the Provider account for the provider dashboard.');if(role==='resource_owner' && !['resource_owner','admin'].includes(u.role)) throw new Error('This login is for a Provider account. Please use the Farmer account for the farmer dashboard.');FG_AUTH.setSession(r.access_token,u);let next=q.get('next');if(!next) next=u.role==='farmer'?'farmer-overview.html':'provider-overview.html';if(u.role==='farmer' && next.startsWith('provider-')) next='farmer-overview.html';if(u.role!=='farmer' && next.startsWith('farmer-')) next='provider-overview.html';location.href=next}catch(x){err.innerHTML='<div class="login-error">'+x.message+'</div>'}}})();</script></body></html>
